<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        p {
            margin-bottom: 20px;
            font-size: 14px;
            color: #ddd;
        }
        button {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
        }
        button:hover {
            background-color: #d63031;
        }
        #output {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Our App</h1>
        <p>This is built for free and hosted on GitHub Pages!</p>
        <button onclick="performAction()">Click Me</button>
        <div id="output"></div>
    </div>

    <script>
        function performAction() {
            const messages = [
                "🚀 App is running successfully!",
                "✨ You are doing great, Parth!",
                "🔥 Ready to build the next feature?",
                "💡 Success is just a step away!"
            ];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById("output").innerText = randomMsg;
        }
    </script>

</body>
</html>
